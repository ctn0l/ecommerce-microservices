spring.application.name=product-service
server.port=${PRODUCT_SERVICE_PORT:8082}

spring.datasource.url=jdbc:postgresql://${PRODUCT_DB_HOST:localhost}:${PRODUCT_DB_PORT:5434}/${PRODUCT_DB_NAME:products}
spring.datasource.username=${PRODUCT_DB_USERNAME:product_service}
spring.datasource.password=${PRODUCT_DB_PASSWORD:product_service_dev}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=true

info.app.name=${spring.application.name}
info.app.description=E-commerce product service
