spring.application.name=order-service
server.port=${ORDER_SERVICE_PORT:8083}

spring.datasource.url=jdbc:postgresql://${ORDER_DB_HOST:localhost}:${ORDER_DB_PORT:5435}/${ORDER_DB_NAME:orders}
spring.datasource.username=${ORDER_DB_USERNAME:order_service}
spring.datasource.password=${ORDER_DB_PASSWORD:order_service_dev}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

services.user-url=${USER_SERVICE_URL:http://localhost:8081}
services.product-url=${PRODUCT_SERVICE_URL:http://localhost:8082}
services.connect-timeout=${SERVICE_CONNECT_TIMEOUT:2s}
services.read-timeout=${SERVICE_READ_TIMEOUT:5s}
checkout.recovery.enabled=${CHECKOUT_RECOVERY_ENABLED:true}
checkout.recovery.delay=${CHECKOUT_RECOVERY_DELAY:5000}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=E-commerce cart and order service
