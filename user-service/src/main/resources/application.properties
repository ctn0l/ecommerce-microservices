spring.application.name=user-service
server.port=${USER_SERVICE_PORT:8081}

spring.datasource.url=jdbc:postgresql://${USER_DB_HOST:localhost}:${USER_DB_PORT:5433}/${USER_DB_NAME:users}
spring.datasource.username=${USER_DB_USERNAME:user_service}
spring.datasource.password=${USER_DB_PASSWORD:user_service_dev}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=true

info.app.name=${spring.application.name}
info.app.description=E-commerce user service
